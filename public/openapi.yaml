openapi: 3.1.0
info:
  title: Deplograph API
  version: 0.2.0
  description: Software inventory, release lineage, and deployment evidence.
servers:
  - url: /
security:
  - IntegrationCredential: []
paths:
  /api/v1/inventories:
    post:
      operationId: importInventory
      summary: Import CycloneDX 1.x or SPDX 2.x document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryRequest'
      responses:
        '201':
          description: Inventory imported
          content:
            application/json:
              schema:
                type: object
                required: [inventory_snapshot_id, artifact_id, sha256, component_count, dependency_count, match_status]
                properties:
                  inventory_snapshot_id: { type: integer }
                  artifact_id: { type: integer }
                  sha256: { type: string }
                  component_count: { type: integer }
                  dependency_count: { type: integer }
                  match_status: { type: string }
        '401': { description: Missing, expired or revoked credential }
        '403': { description: Credential scope or permission denied }
        '409': { description: Artifact identity conflict }
        '422': { description: Invalid import }
  /api/v1/inventories/lockfile:
    post:
      operationId: importRubyLockfile
      summary: Import a Ruby Gemfile.lock as partial CycloneDX inventory
      description: Only package names, resolved versions and dependency relationships are ingested. This is not a verified build or runtime inventory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repository, lockfile]
              properties:
                repository: { type: string }
                lockfile: { type: string }
      responses:
        '201':
          description: Lockfile inventory imported
          content:
            application/json:
              schema:
                type: object
                required: [inventory_snapshot_id, artifact_id, sha256, component_count, dependency_count, coverage_status, match_status]
                properties:
                  inventory_snapshot_id: { type: integer }
                  artifact_id: { type: integer }
                  sha256: { type: string }
                  component_count: { type: integer }
                  dependency_count: { type: integer }
                  coverage_status: { type: string, enum: [partial] }
                  match_status: { type: string }
        '401': { description: Unauthorized }
        '403': { description: Credential scope or permission denied }
        '422': { description: Invalid or oversized lockfile }
  /api/v1/drift/comparisons:
    post:
      operationId: compareEnvironments
      summary: Create an evidence-qualified environment drift comparison
      description: |
        Defaults to reported deployment evidence. The observed mode uses incomplete
        runtime observations and never asserts full rollout verification.
        Missing inventories, incomplete coverage and stale advisory scans are explicit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repository, baseline_environment, target_environment]
              properties:
                repository: { type: string }
                baseline_environment: { type: string }
                target_environment: { type: string }
                mode: { type: string, enum: [reported, observed], default: reported }
      responses:
        '201':
          description: Immutable comparison result, including evidence snapshot IDs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriftComparisonResponse' }
        '401': { description: Missing or revoked credential }
        '403': { description: Repository or environment scope denied }
        '404': { description: Application or environment not found }
        '422': { description: Invalid comparison }
    get:
      operationId: listDriftComparisons
      parameters:
        - name: repository
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Comparison history for authorized environments
          content:
            application/json:
              schema:
                type: object
                required: [comparisons]
                properties:
                  comparisons:
                    type: array
                    items: { $ref: '#/components/schemas/DriftComparisonResponse' }
        '401': { description: Missing or revoked credential }
        '403': { description: Repository scope denied }
        '404': { description: Application not found }
  /api/v1/drift/comparisons/{id}:
    get:
      operationId: getDriftComparison
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Comparison by identifier, scoped to the tenant and both environments
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriftComparisonResponse' }
        '401': { description: Missing or revoked credential }
        '403': { description: Environment scope denied }
        '404': { description: Comparison not found }
  /api/v1/configuration_snapshots:
    post:
      operationId: importEnvNames
      summary: Store an ENV names-only configuration snapshot
      description: Only key names are accepted. Values and unknown request properties are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [repository, environment, source, scope, workload, collection_id, completeness, collected_at, keys]
              properties:
                repository: { type: string }
                environment: { type: string }
                source: { type: string }
                scope: { type: string, enum: [declared, process] }
                workload: { type: string }
                collection_id: { type: string }
                completeness: { type: string, enum: [complete, partial] }
                collected_at: { type: string, format: date-time }
                keys:
                  type: array
                  uniqueItems: true
                  maxItems: 5000
                  items:
                    type: string
                    pattern: "^[A-Za-z_][A-Za-z0-9_]{0,127}$"
      responses:
        '201':
          description: Snapshot stored
          content:
            application/json:
              schema:
                type: object
                required: [id, environment, workload, scope, completeness, collected_at, key_count, keys_sha256]
                properties:
                  id: { type: integer }
                  environment: { type: string }
                  workload: { type: string }
                  scope: { type: string }
                  completeness: { type: string }
                  collected_at: { type: string, format: date-time }
                  key_count: { type: integer }
                  keys_sha256: { type: string }
        '401': { description: Invalid credential }
        '403': { description: Missing provider or environment permission }
        '409': { description: Conflicting collection ID }
        '422': { description: Invalid or value-bearing payload }
    get:
      operationId: listEnvNameSnapshots
      parameters:
        - name: repository
          in: query
          required: true
          schema: { type: string }
        - name: environment
          in: query
          required: true
          schema: { type: string }
        - name: workload
          in: query
          schema: { type: string }
        - name: scope
          in: query
          schema: { type: string, enum: [declared, process] }
      responses:
        '200':
          description: Scoped names-only snapshots
          content:
            application/json:
              schema:
                type: object
                required: [snapshots]
                properties:
                  snapshots:
                    type: array
                    items: { type: object }
        '401': { description: Invalid credential }
        '403': { description: Environment scope denied }
        '404': { description: Environment not found }
  /api/v1/configuration/drift:
    post:
      operationId: compareEnvNames
      summary: Compare ENV key name sets between environments
      description: Matching workload, scope and source are required. Partial evidence never proves absence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repository, baseline_environment, target_environment, scope, workload]
              properties:
                repository: { type: string }
                baseline_environment: { type: string }
                target_environment: { type: string }
                scope: { type: string, enum: [declared, process] }
                workload: { type: string }
      responses:
        '201':
          description: Persisted configuration drift result
          content:
            application/json:
              schema:
                type: object
                required: [id, status, result]
                properties:
                  id: { type: integer }
                  status: { type: string, enum: [same, different, partial, unknown, stale] }
                  result: { type: object }
        '401': { description: Invalid credential }
        '403': { description: Environment scope denied }
        '404': { description: Environment not found }
        '422': { description: Invalid comparison }
  /api/v1/configuration/fingerprints:
    post:
      operationId: importEnvValueFingerprints
      summary: Attach client-computed keyed HMACs to an existing names-only snapshot
      description: |
        The server never receives plaintext ENV values or the shared HMAC key.
        Caller must match the snapshot provider and hold report/observe permission.
        Fingerprints are accepted only for names in the snapshot, up to ten
        minutes after the names-only snapshot was collected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [repository, environment, snapshot_id, key_id, algorithm, fingerprints]
              properties:
                repository: { type: string }
                environment: { type: string }
                snapshot_id: { type: integer }
                key_id: { type: string, maxLength: 64 }
                algorithm: { type: string, const: "HMAC-SHA256-v1" }
                fingerprints:
                  type: object
                  additionalProperties:
                    type: string
                    minLength: 64
                    maxLength: 64
                  maxProperties: 5000
      responses:
        '201':
          description: Immutable fingerprint batch recorded without returning any digests
          content:
            application/json:
              schema:
                type: object
                required: [id, snapshot_id, key_id, algorithm, fingerprint_count, collected_at]
                properties:
                  id: { type: integer }
                  snapshot_id: { type: integer }
                  key_id: { type: string }
                  algorithm: { type: string }
                  fingerprint_count: { type: integer }
                  collected_at: { type: string, format: date-time }
        '401': { description: Invalid credential }
        '403': { description: Provider or scope denied }
        '404': { description: Snapshot not found }
        '409': { description: Key ID replay conflict }
        '422': { description: Non-HMAC, plaintext or invalid fingerprint data }
  /api/v1/configuration/fingerprints/drift:
    post:
      operationId: compareEnvValueFingerprints
      summary: Compare HMAC evidence under per-variable policies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [repository, baseline_environment, target_environment, workload, scope]
              properties:
                repository: { type: string }
                baseline_environment: { type: string }
                target_environment: { type: string }
                workload: { type: string }
                scope: { type: string, enum: [declared, process] }
      responses:
        '201':
          description: New evidence-qualified comparison
          content:
            application/json:
              schema:
                type: object
                required: [id, status, result]
                properties:
                  id: { type: integer }
                  status: { type: string, enum: [same, different, partial, unknown, stale] }
                  result: { type: object }
        '401': { description: Invalid credential }
        '403': { description: Scope denied }
        '404': { description: Application or environment missing }
        '422': { description: Invalid comparison }
  /api/v1/configuration/policies:
    get:
      operationId: listEnvValuePolicies
      parameters:
        - name: repository
          in: query
          required: true
          schema: { type: string }
        - name: baseline_environment
          in: query
          required: true
          schema: { type: string }
        - name: target_environment
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Scoped policy listing
          content:
            application/json:
              schema:
                type: object
                required: [policies]
                properties:
                  policies: { type: array, items: { type: object } }
        '401': { description: Invalid credential }
        '403': { description: Scope denied }
        '404': { description: Application missing }
    put:
      operationId: upsertEnvValuePolicy
      summary: Set or update an audited ENV comparison rule
      description: |
        Requires manage permission for both environments.
        The default rule for keys without a policy is must_match.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [repository, baseline_environment, target_environment, workload, scope, name, rule]
              properties:
                repository: { type: string }
                baseline_environment: { type: string }
                target_environment: { type: string }
                workload: { type: string }
                scope: { type: string, enum: [declared, process] }
                name: { type: string }
                rule: { type: string, enum: [must_match, must_differ, allowed_to_differ, ignore] }
      responses:
        '200':
          description: Policy stored; changes are audited
          content:
            application/json:
              schema:
                type: object
                required: [id, repository, baseline_environment, target_environment, name, workload, scope, rule, updated_at]
                properties:
                  id: { type: integer }
                  repository: { type: string }
                  baseline_environment: { type: string }
                  target_environment: { type: string }
                  name: { type: string }
                  workload: { type: string }
                  scope: { type: string }
                  rule: { type: string }
                  updated_at: { type: string, format: date-time }
        '401': { description: Invalid credential }
        '403': { description: Missing manage permission }
        '404': { description: Application or environment missing }
        '422': { description: Invalid rule or scope }
  /api/v1/findings:
    get:
      operationId: listDriftFindings
      summary: List evidence-qualified operational findings
      description: |
        Read-only endpoint. Scoped to organization, allowed repositories and
        BOTH comparison environments before pagination. Does not expose HMAC
        digests, raw ENV values or cross-tenant finding identifiers.
      parameters:
        - name: repository
          in: query
          schema: { type: string }
        - name: environment
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [open, acknowledged, investigating, verification_pending, resolved, dismissed]
      responses:
        '200':
          description: Scoped findings register
          content:
            application/json:
              schema:
                type: object
                required: [findings]
                properties:
                  findings:
                    type: array
                    items: { $ref: '#/components/schemas/DriftFindingResponse' }
        '401': { description: Missing or expired credential }
        '403': { description: Credential scope denied }
        '422': { description: Unsupported status filter }
  /api/v1/findings/{id}:
    get:
      operationId: getDriftFinding
      summary: Inspect one finding without leaking raw evidence
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Finding metadata and latest evidence reference
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriftFindingResponse' }
        '401': { description: Missing or expired credential }
        '403': { description: One or both environment scopes denied }
        '404': { description: Finding does not belong to the organization }
  /api/v1/releases:
    post:
      operationId: registerRelease
      summary: Register source revision, logical release and artifacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseRequest'
      responses:
        '201':
          description: Release registered
          content:
            application/json:
              schema:
                type: object
                required: [id, repository, release, commit_sha, artifacts]
                properties:
                  id: { type: integer }
                  repository: { type: string }
                  release: { type: string }
                  commit_sha: { type: string }
                  artifacts: { type: array, items: { type: string } }
        '401': { description: Unauthorized }
        '409': { description: Conflicting release identity }
        '422': { description: Invalid release }
    get:
      operationId: listReleases
      parameters:
        - name: repository
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Release list
          content:
            application/json:
              schema:
                type: object
                required: [releases]
                properties:
                  releases: { type: array, items: { type: object } }
        '401': { description: Unauthorized }
        '404': { description: Repository not found }
  /api/v1/deployments:
    post:
      operationId: reportLegacyDeployment
      summary: Report a deployment (legacy ingestion contract)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '201': { description: Report recorded, runtime not verified }
        '401': { description: Unauthorized }
        '422': { description: Invalid report }
  /api/v1/integration_events:
    post:
      operationId: ingestIntegrationEvent
      summary: Correlate deployment reports and independent runtime observations
      description: |
        Every request requires an active organization credential. Required permissions
        are read, report or observe; event source must match credential provider.
        Repository and environment scopes are enforced before data is accessed.
        Observations are partial evidence, not proof of completed rollout.
      security:
        - IntegrationCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationEvent'
      responses:
        '202':
          description: Event accepted, idempotent by source and event ID
          content:
            application/json:
              schema:
                type: object
                required: [event_id, source, event_type, environment_id]
                properties:
                  event_id: { type: string }
                  source: { type: string }
                  event_type: { type: string }
                  environment_id: { type: integer }
                  deployment_id: { type: [integer, 'null'] }
        '401': { description: Unauthorized }
        '409': { description: Event or artifact identity conflict }
        '422': { description: Invalid event }
        '403': { description: Credential lacks scope or permission }
  /api/v1/environments:
    get:
      operationId: listEnvironmentExposure
      parameters:
        - name: repository
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Per-environment reported and observed inventories
          content:
            application/json:
              schema:
                type: object
                required: [repository, environments]
                properties:
                  repository: { type: string }
                  environments:
                    type: array
                    items: { $ref: '#/components/schemas/EnvironmentSummary' }
        '401': { description: Unauthorized }
        '404': { description: Repository not found }
  /api/v1/environment_events:
    post:
      operationId: environmentLifecycleEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '201': { description: Environment updated }
        '401': { description: Unauthorized }
        '422': { description: Invalid event }
  /api/v1/repositories/inspect:
    post:
      operationId: inspectRepository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repository]
              properties:
                repository: { type: string }
      responses:
        '200': { description: GitHub repository inspection }
        '401': { description: Unauthorized }
        '422': { description: Invalid request }
        '502': { description: GitHub API failure }
  /api/v1/github/webhooks:
    post:
      operationId: receiveGithubWebhook
      security: []
      summary: Validate GitHub HMAC and update installation permissions
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema: { type: string }
        - name: X-GitHub-Event
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '202': { description: Webhook accepted }
        '401': { description: Invalid signature }
        '422': { description: Invalid payload }
        '503': { description: Webhook secret not configured }
components:
  securitySchemes:
    IntegrationCredential:
      type: http
      scheme: bearer
      description: Hashed, organization-scoped credential with read/report/observe and optional repository/environment restrictions
  schemas:
    DriftComparisonResponse:
      type: object
      required: [id, repository, baseline_environment, target_environment, compared_at, status, result]
      properties:
        id: { type: integer }
        repository: { type: string }
        baseline_environment: { type: string }
        target_environment: { type: string }
        compared_at: { type: string, format: date-time }
        status: { type: string, enum: [same, different, partial, unknown, stale] }
        result:
          type: object
          required: [status, mode, verified_runtime, confidence, known_differences, incomplete_dimensions, baseline, target, dimensions]
          properties:
            status: { type: string }
            mode: { type: string, enum: [reported, observed, configuration_names, configuration_fingerprints] }
            verified_runtime: { type: boolean, const: false }
            confidence: { type: string, enum: [partial, reported_only] }
            known_differences: { type: array, items: { type: string } }
            incomplete_dimensions: { type: array, items: { type: string } }
            baseline: { type: object }
            target: { type: object }
            dimensions: { type: object }
    DriftFindingResponse:
      type: object
      required: [id, repository, baseline_environment, target_environment, category, subject, title, status, severity, priority, evidence_quality, latest_comparison_id, first_seen_at, last_seen_at, assigned_to_id, next_action]
      properties:
        id: { type: integer }
        repository: { type: string }
        baseline_environment: { type: string }
        target_environment: { type: string }
        category: { type: string }
        subject: { type: string }
        title: { type: string }
        status:
          type: string
          enum: [open, acknowledged, investigating, verification_pending, resolved, dismissed]
        severity: { type: string, enum: [unknown, low, medium, high, critical] }
        priority: { type: string, enum: [p1, p2, p3] }
        evidence_quality: { type: string, enum: [reported_only, partial, stale, unknown, verified] }
        latest_comparison_id: { type: integer }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        assigned_to_id: { type: [integer, 'null'] }
        next_action: { type: [string, 'null'] }
    InventoryRequest:
      type: object
      required: [repository, artifact_identifier, format, sbom]
      properties:
        repository: { type: string }
        artifact_identifier: { type: string }
        artifact_kind: { type: string, enum: [source, image, binary] }
        format: { type: string, enum: [cyclonedx, spdx] }
        sbom: { type: object }
    ReleaseRequest:
      type: object
      required: [repository, release, commit_sha, artifacts]
      properties:
        repository: { type: string }
        release: { type: string }
        commit_sha: { type: string, pattern: '^[a-f0-9]{40}$' }
        build: { type: object }
        artifacts:
          type: array
          minItems: 1
          items:
            type: object
            required: [identifier, image_digest]
            properties:
              identifier: { type: string }
              image_digest: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
    IntegrationEvent:
      type: object
      required: [repository, environment, source, event_type, event_id, occurred_at]
      properties:
        repository: { type: string }
        environment: { type: string }
        environment_kind: { type: string }
        source: { type: string, enum: [ci, github_actions, kamal, kubernetes, kamal_agent, docker_agent, aws_ecs] }
        event_type: { type: string, enum: [deployment.reported, artifact.observed] }
        event_id: { type: string }
        occurred_at: { type: string, format: date-time }
        deployment_id: { type: string }
        image: { type: string }
        image_digest: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
        artifact_identifier: { type: string }
        workload: { type: string }
        release: { type: string }
    EnvironmentSummary:
      type: object
      required: [name, kind, state, verification_status, reported, observed]
      properties:
        name: { type: string }
        kind: { type: string }
        state: { type: string }
        verification_status:
          type: string
          enum: [unverified, partial, stale, observations_only, unknown, conflicting_observation]
        expires_at: { type: [string, 'null'], format: date-time }
        reported:
          type: [object, 'null']
          properties:
            reporting_sources: { type: array, items: { type: string } }
        observed:
          type: array
          items:
            type: object
            required: [workload, source, event_id, image_digest, observed_at, fresh, inventory_status, vulnerability_ids]
            properties:
              workload: { type: string }
              source: { type: string }
              event_id: { type: string }
              image_digest: { type: string }
              observed_at: { type: string, format: date-time }
              fresh: { type: boolean }
              inventory_status: { type: string }
              vulnerability_ids: { type: array, items: { type: string } }
