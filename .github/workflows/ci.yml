name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/deplograph_test
      SECRET_KEY_BASE: test-only-secret-key-base
      DEPLOGRAPH_INGEST_TOKEN: test-only-ingest-token
      OSV_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: false
      - run: bundle install --jobs 4 --retry 3
      - name: Emit resolved lockfile for initial repository bootstrap
        run: |
          printf 'BEGIN_DEPL_LOCKFILE_BASE64='
          base64 -w0 Gemfile.lock
          printf '=END_DEPL_LOCKFILE_BASE64\\n'
      - run: bin/rails db:prepare
      - run: bin/rails test
