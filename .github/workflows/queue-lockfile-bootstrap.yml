name: Bootstrap reproducible queue lockfile

on:
  pull_request:
    paths:
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/workflows/queue-lockfile-bootstrap.yml"

permissions:
  contents: read

jobs:
  resolve-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: false
      - name: Resolve Solid Queue dependencies
        run: bundle lock
      - name: Emit resolved public lockfile for a reviewed commit
        run: |
          echo "DEPLOGRAPH_LOCKFILE_START"
          cat Gemfile.lock
          echo "DEPLOGRAPH_LOCKFILE_END"
