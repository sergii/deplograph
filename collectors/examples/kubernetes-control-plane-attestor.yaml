# Example only. Replace placeholders, pin the attestor image by immutable OCI digest,
# provision separately approved keys/credential, and review namespace + RBAC.
# No cluster resources or keys are provisioned automatically by this repository.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deplograph-control-plane-attestor
  namespace: production
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deplograph-control-plane-reader
  namespace: production
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deplograph-control-plane-reader
  namespace: production
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: deplograph-control-plane-reader
subjects:
  - kind: ServiceAccount
    name: deplograph-control-plane-attestor
    namespace: production
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: deplograph-control-plane-attestor
  namespace: production
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 90
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: deplograph-control-plane-attestor
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: attestor
              image: example.invalid/deplograph-control-plane-attestor@sha256:REPLACE_WITH_64_HEX_DIGEST
              imagePullPolicy: IfNotPresent
              command: ["ruby", "/app/collectors/bin/kubernetes_control_plane_attest"]
              env:
                - name: DEPLOGRAPH_ATTESTATION_URL
                  value: "https://deplograph.example/api/v1/runtime/attestations"
                - name: DEPLOGRAPH_REPOSITORY
                  value: "acme/payments"
                - name: DEPLOGRAPH_ENVIRONMENT
                  value: "production"
                - name: DEPLOGRAPH_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: DEPLOGRAPH_EXPECTED_WORKLOADS
                  value: '{"web":2,"worker":1}'
                - name: DEPLOGRAPH_IMAGE_REPOSITORY
                  value: "ghcr.io/acme/payments"
                - name: DEPLOGRAPH_ATTESTOR_ID
                  value: "REPLACE_WITH_REGISTERED_ID"
                - name: DEPLOGRAPH_TOKEN_FILE
                  value: "/run/attestor-credential/token"
                - name: DEPLOGRAPH_SIGNING_KEY_FILE
                  value: "/run/attestor-key/private.pem"
              volumeMounts:
                - name: signing-key
                  mountPath: "/run/attestor-key"
                  readOnly: true
                - name: observe-credential
                  mountPath: "/run/attestor-credential"
                  readOnly: true
                - name: temporary
                  mountPath: "/tmp"
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: signing-key
              secret:
                secretName: deplograph-ed25519-key
                defaultMode: 0440
            - name: observe-credential
              secret:
                secretName: deplograph-control-plane-credential
                defaultMode: 0440
            - name: temporary
              emptyDir:
                sizeLimit: 16Mi
